name: Build ARM template

on:
  workflow_call:

  workflow_dispatch:

jobs:
  build:
    name: Build ARM template
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build ARM template
        run: az bicep build --file infrastructure/azuredeploy.bicep --outfile azuredeploy.json

      - name: Store ARM template
        uses: actions/upload-artifact@v7
        with:
          name: arm
          path: azuredeploy.json
          retention-days: 1
          if-no-files-found: error
