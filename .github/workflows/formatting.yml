name: Code is formated with CSharpier
on:
  workflow_call:

jobs:
  check_formatting:
    name: Check code formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8
      - name: Restore tools
        run: dotnet tool restore
      - name: Check code formatting
        run: dotnet csharpier check .
