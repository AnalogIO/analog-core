name: Scale down app service plan

on:
  schedule:
    - cron: "15 16 * * 1-5" # UTC Time

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: prd

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Downscale outside hours
        uses: azure/CLI@v2
        with:
          azcliversion: 2.73.0
          inlineScript: |
            az appservice plan update --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --name ${{ vars.AZURE_APPSERVICE_PLAN_NAME }} --sku B1
